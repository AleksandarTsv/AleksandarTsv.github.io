<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Честити 8 месеца</title>
  <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="icon.png">

   

</head>
<body>

   <div class="header-images">
  <img src="giphy.gif" alt="left cute" class="side-img left-img">
  <img src="make transparent bac.png" alt="swans" class="swans-center">
  <img src="sticker.gif" alt="right cute" class="side-img right-img">
</div>

<div class="container">
    
    <h1>Честити 8 месеца, Мило </h1>
    <p class="subtitle">Обичам те, ти си най-прекрасното нещо в живота ми </p>

    <div class="time-box">
      <h2>Общо време заедно ❤️</h2>
      <div class="time">
        <div><span id="months">0</span><p>Месеца</p></div>
        <div><span id="days">0</span><p>Дни</p></div>
        <div><span id="hours">0</span><p>Часа</p></div>
        <div><span id="minutes">0</span><p>Минути</p></div>
        <div><span id="seconds">0</span><p>Секунди</p></div>
      </div>
    </div>

    <h3>Искаш ли винаги да сме заедно? :)</h3>
    <div class="buttons">
      <button class="yes-btn" onclick="document.location='page1.html'">ДА</button>
      <button class="run-btn">НЕ</button>
    </div>
    <p class="note">Нямаш много избор хихи </p>
  </div>

  <script src="script.js"></script>
</body>
</html>
